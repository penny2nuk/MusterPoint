<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Site Presence & Muster Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="h-full text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- LOGIN SECTION -->
  <div id="login-view" class="flex min-h-full items-center justify-center p-6">
    <div class="glass-card w-full max-w-md rounded-2xl p-8 shadow-2xl">
      <div class="mb-8 text-center">
        <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-600/20 text-indigo-400 mb-3 border border-indigo-500/30">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h1 class="text-2xl font-extrabold text-white tracking-tight">Site Security Portal</h1>
      </div>
      <form id="login-form" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email</label>
          <input id="login-email" type="email" required class="w-full rounded-xl bg-slate-900/80 border border-slate-700/80 px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
          <input id="login-password" type="password" required class="w-full rounded-xl bg-slate-900/80 border border-slate-700/80 px-4 py-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
        </div>
        <button type="submit" class="w-full rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 text-sm transition duration-200">Sign In</button>
        <p id="login-error" class="text-xs text-red-400 text-center hidden font-medium"></p>
      </form>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboard-view" class="hidden min-h-full p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto space-y-6">
    
    <!-- Top Header Bar -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-800">
      <div>
        <div class="flex items-center gap-3">
          <h1 class="text-2xl font-extrabold text-white tracking-tight">Site Muster & Occupancy</h1>
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Live Sync</span>
        </div>
      </div>
      <button id="logout-btn" class="px-4 py-2 text-xs font-semibold text-slate-300 hover:text-white bg-slate-900 hover:bg-slate-800 border border-slate-700/80 rounded-xl transition">Sign Out</button>
    </header>

    <!-- Metrics -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="glass-card rounded-2xl p-5">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Onsite Currently</span>
        <div class="mt-2 flex items-baseline justify-between">
          <span id="count-onsite" class="text-4xl font-extrabold text-emerald-400">0</span>
        </div>
      </div>
      <div class="glass-card rounded-2xl p-5">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Mustered / Accounted</span>
        <div class="mt-2 flex items-baseline justify-between">
          <span id="count-mustered" class="text-4xl font-extrabold text-sky-400">0</span>
        </div>
      </div>
      <div class="glass-card rounded-2xl p-5">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Offsite</span>
        <div class="mt-2 flex items-baseline justify-between">
          <span id="count-offsite" class="text-4xl font-extrabold text-slate-400">0</span>
        </div>
      </div>
    </div>

    <!-- Data Register Table -->
    <div class="glass-card rounded-2xl overflow-hidden shadow-2xl">
      
      <!-- Controls (Search & Filters) -->
      <div class="p-4 sm:p-5 border-b border-slate-800 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
        
        <!-- Filter Pills -->
        <div class="flex flex-wrap items-center gap-2" id="filter-container">
          <button data-filter="ALL" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-700 text-white transition">All Users</button>
          <button data-filter="ONSITE" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 hover:bg-slate-800 transition border border-transparent">Onsite</button>
          <button data-filter="MUSTERED" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 hover:bg-slate-800 transition border border-transparent">Mustered</button>
          <button data-filter="OFFSITE" class="filter-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 hover:bg-slate-800 transition border border-transparent">Offsite</button>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full lg:w-80">
          <svg class="absolute left-3.5 top-2.5 h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="search-input" type="text" placeholder="Search directory..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
        </div>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-slate-300">
          <thead class="bg-slate-900/80 text-slate-400 font-semibold uppercase tracking-wider border-b border-slate-800">
            <tr>
              <th class="px-6 py-4">User Name</th>
              <th class="px-6 py-4">Company</th>
              <th class="px-6 py-4">Phone Number</th>
              <th class="px-6 py-4">Status</th>
              <th class="px-6 py-4">Last Zone Reader</th>
              <th class="px-6 py-4">Last Updated</th>
            </tr>
          </thead>
          <tbody id="user-table-body" class="divide-y divide-slate-800/60 font-medium">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // === CONFIGURATION ===
    const SUPABASE_URL = "https://xwhudblncybhnpywtbyz.supabase.co"; 
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3aHVkYmxuY3liaG5weXd0Ynl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwOTM1MzIsImV4cCI6MjEwMTY2OTUzMn0.KGmqXn79Lz1yAgkMhnhHFq3OnU4ASDs5TpLvB7wxLaM";         

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let usersMap = new Map();
    let currentFilter = 'ALL'; // State for the active filter

    // Auth & View elements
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');

    db.auth.onAuthStateChange((event, session) => {
      if (session) {
        loginView.classList.add('hidden');
        dashboardView.classList.remove('hidden');
        initDashboard();
      } else {
        loginView.classList.remove('hidden');
        dashboardView.classList.add('hidden');
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.classList.add('hidden');
      const { error } = await db.auth.signInWithPassword({ 
        email: document.getElementById('login-email').value, 
        password: document.getElementById('login-password').value 
      });
      if (error) {
        loginError.textContent = error.message;
        loginError.classList.remove('hidden');
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => db.auth.signOut());

    // Filter Button Logic
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        // Reset all buttons
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = 'filter-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-900 text-slate-400 hover:bg-slate-800 transition border border-transparent';
        });
        // Activate clicked button
        e.target.className = 'filter-btn px-4 py-1.5 rounded-full text-xs font-bold bg-slate-700 text-white transition';
        currentFilter = e.target.getAttribute('data-filter');
        renderUI();
      });
    });

    async function initDashboard() {
      const { data, error } = await db.from('presence_state').select('*').order('last_updated', { ascending: false });
      if (!error && data) {
        data.forEach(user => usersMap.set(user.user_id, user));
        renderUI();
      }

      db.channel('public:presence_state')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'presence_state' }, (payload) => {
          usersMap.set(payload.new.user_id, payload.new);
          renderUI();
        })
        .subscribe();
    }

    function renderUI() {
      const users = Array.from(usersMap.values());
      const query = document.getElementById('search-input').value.toLowerCase();
      
      let onsite = 0, mustered = 0, offsite = 0;
      const tbody = document.getElementById('user-table-body');
      tbody.innerHTML = '';

      users.forEach(u => {
        // Update global counters regardless of current filter or search
        if (u.status === 'ONSITE') onsite++;
        if (u.status === 'MUSTERED') mustered++;
        if (u.status === 'OFFSITE') offsite++;

        // Apply Status Filter Pill
        if (currentFilter !== 'ALL' && u.status !== currentFilter) return;

        // Apply Search Bar Filter
        const match = [u.user_name, u.company_name, u.telephone_number, u.last_zone]
          .some(field => field && field.toLowerCase().includes(query));
        if (query && !match) return;

        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/40 transition duration-150';

        let badgeStyle = 'bg-slate-500/10 text-slate-400 border-slate-500/20';
        let badgeDot = 'bg-slate-400';
        if (u.status === 'ONSITE') {
          badgeStyle = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
          badgeDot = 'bg-emerald-400';
        }
        if (u.status === 'MUSTERED') {
          badgeStyle = 'bg-sky-500/10 text-sky-400 border-sky-500/20';
          badgeDot = 'bg-sky-400';
        }

        const phoneDisplay = u.telephone_number && u.telephone_number !== 'N/A' 
          ? `<a href="tel:${u.telephone_number}" class="text-indigo-400 hover:underline">${u.telephone_number}</a>`
          : '<span class="text-slate-500">N/A</span>';

        tr.innerHTML = `
          <td class="px-6 py-4 font-bold text-white text-sm">${u.user_name}</td>
          <td class="px-6 py-4 text-slate-300 font-semibold">${u.company_name || 'N/A'}</td>
          <td class="px-6 py-4">${phoneDisplay}</td>
          <td class="px-6 py-4">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold border ${badgeStyle}">
              <span class="h-1.5 w-1.5 rounded-full ${badgeDot}"></span>
              ${u.status}
            </span>
          </td>
          <td class="px-6 py-4 text-slate-300">${u.last_zone || '-'}</td>
          <td class="px-6 py-4 text-slate-400 text-[11px]">${new Date(u.last_updated).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'})}</td>
        `;
        tbody.appendChild(tr);
      });

      // Update Top Metrics Cards
      document.getElementById('count-onsite').textContent = onsite;
      document.getElementById('count-mustered').textContent = mustered;
      document.getElementById('count-offsite').textContent = offsite;
    }

    document.getElementById('search-input').addEventListener('input', renderUI);
  </script>
</body>
</html>
