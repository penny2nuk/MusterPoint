<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Muster & Presence Dashboard AP</title>
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-surface: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-onsite: #f59e0b;
      --accent-mustered: #10b981;
      --accent-offsite: #64748b;
      --danger: #ef4444;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation / Header */
    header {
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-brand h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      flex-wrap: wrap;
    }

    /* Device Health Indicator */
    .device-health-widget {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-primary);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
    }

    .status-indicator-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-online {
      background-color: var(--accent-mustered);
      box-shadow: 0 0 8px var(--accent-mustered);
    }

    .dot-offline {
      background-color: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }

    .device-title {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .device-title strong {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .badge-online {
      background-color: #064e3b;
      color: #6ee7b7;
    }

    .badge-offline {
      background-color: #7f1d1d;
      color: #fca5a5;
    }

    .device-timestamp {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Metric Stat Cards */
    .dashboard-container {
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      padding: 1.5rem 2rem;
      flex: 1;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1.25rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
    }

    .stat-card.card-total::before { background-color: #38bdf8; }
    .stat-card.card-onsite::before { background-color: var(--accent-onsite); }
    .stat-card.card-mustered::before { background-color: var(--accent-mustered); }
    .stat-card.card-offsite::before { background-color: var(--accent-offsite); }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 700;
      margin-top: 0.4rem;
    }

    /* Filter & Search Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .search-input {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      min-width: 280px;
      outline: none;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
    }

    .btn-filter {
      background: var(--bg-secondary);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
    }

    .btn-filter.active, .btn-filter:hover {
      background: var(--bg-surface);
      color: var(--text-main);
      border-color: #64748b;
    }

    /* Personnel Table */
    .table-wrapper {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    thead tr {
      background-color: rgba(15, 23, 42, 0.6);
      border-bottom: 1px solid var(--border-color);
    }

    th {
      padding: 0.9rem 1.25rem;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tbody tr {
      border-bottom: 1px solid var(--border-color);
      transition: background 0.15s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background-color: rgba(51, 65, 85, 0.3);
    }

    td {
      padding: 1rem 1.25rem;
      color: var(--text-main);
      vertical-align: middle;
    }

    .user-info-name {
      font-weight: 600;
    }

    .user-info-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .status-ONSITE {
      background-color: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .status-MUSTERED {
      background-color: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-OFFSITE {
      background-color: rgba(100, 116, 139, 0.15);
      color: #94a3b8;
      border: 1px solid rgba(100, 116, 139, 0.3);
    }

    .btn-action {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-action:hover {
      background: #475569;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header>
    <div class="header-brand">
      <h1>🚨 Muster Emergency Dashboard</h1>
    </div>

    <div class="header-controls">
      <!-- Device Health Widget -->
      <div class="device-health-widget">
        <div id="device-dot" class="status-indicator-dot dot-offline"></div>
        <div class="device-info">
          <div class="device-title">
            <span id="device-name">Remote Muster Unit</span>
            <strong id="device-status-badge" class="badge-offline">OFFLINE</strong>
          </div>
          <div class="device-timestamp" id="device-last-seen">Last check-in: Checking...</div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Dashboard -->
  <div class="dashboard-container">
    
    <!-- Real-Time Metrics -->
    <div class="metrics-grid">
      <div class="stat-card card-total">
        <div class="stat-label">Total Personnel</div>
        <div class="stat-value" id="count-total">0</div>
      </div>
      <div class="stat-card card-onsite">
        <div class="stat-label">On-Site (Unaccounted)</div>
        <div class="stat-value" id="count-onsite" style="color: var(--accent-onsite);">0</div>
      </div>
      <div class="stat-card card-mustered">
        <div class="stat-label">Mustered (Safe)</div>
        <div class="stat-value" id="count-mustered" style="color: var(--accent-mustered);">0</div>
      </div>
      <div class="stat-card card-offsite">
        <div class="stat-label">Off-Site</div>
        <div class="stat-value" id="count-offsite" style="color: var(--accent-offsite);">0</div>
      </div>
    </div>

    <!-- Search and Filters -->
    <div class="controls-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by name, company, or card...">
      
      <div class="filter-group">
        <button class="btn-filter active" data-filter="ALL">All</button>
        <button class="btn-filter" data-filter="ONSITE">On-Site</button>
        <button class="btn-filter" data-filter="MUSTERED">Mustered</button>
        <button class="btn-filter" data-filter="OFFSITE">Off-Site</button>
      </div>
    </div>

    <!-- Personnel Status Table -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Company / Phone</th>
            <th>Card CSN</th>
            <th>Location / Zone</th>
            <th>Status</th>
            <th>Last Activity</th>
            <th>Manual Action</th>
          </tr>
        </thead>
        <tbody id="presenceTableBody">
          <tr>
            <td colspan="7" class="empty-state">Connecting to live database...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. SUPABASE CONFIGURATION
    // ==========================================
    const SUPABASE_URL = "https://xwhudblncybhnpywtbyz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3aHVkYmxuY3liaG5weXd0Ynl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwOTM1MzIsImV4cCI6MjEwMTY2OTUzMn0.KGmqXn79Lz1yAgkMhnhHFq3OnU4ASDs5TpLvB7wxLaM"; // Replace with your Project Anon Key

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let personnelData = [];
    let currentFilter = "ALL";
    let searchTerm = "";

    // 14 hours offline threshold (12-hour timer interval + 2-hour buffer)
    const OFFLINE_THRESHOLD_MS = 14 * 60 * 60 * 1000;

    // ==========================================
    // 2. DEVICE HEALTH LOGIC
    // ==========================================
    function updateDeviceUI(device) {
      const dotEl = document.getElementById("device-dot");
      const nameEl = document.getElementById("device-name");
      const badgeEl = document.getElementById("device-status-badge");
      const lastSeenEl = document.getElementById("device-last-seen");

      if (!device) {
        badgeEl.textContent = "OFFLINE";
        badgeEl.className = "badge-offline";
        dotEl.className = "status-indicator-dot dot-offline";
        lastSeenEl.textContent = "No heartbeat recorded";
        return;
      }

      const lastSeenDate = new Date(device.last_seen);
      const timeDiff = Date.now() - lastSeenDate.getTime();
      const isOnline = timeDiff < OFFLINE_THRESHOLD_MS;

      nameEl.textContent = device.device_name || "Muster Unit";

      if (isOnline) {
        dotEl.className = "status-indicator-dot dot-online";
        badgeEl.className = "badge-online";
        badgeEl.textContent = "ONLINE";
      } else {
        dotEl.className = "status-indicator-dot dot-offline";
        badgeEl.className = "badge-offline";
        badgeEl.textContent = "OFFLINE";
      }

      lastSeenEl.textContent = `Last check-in: ${lastSeenDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} (${lastSeenDate.toLocaleDateString()})`;
    }

    async function loadDeviceHealth() {
      const { data, error } = await supabaseClient
        .from("device_health")
        .select("*")
        .eq("device_id", "MUSTER_UNIT_01")
        .maybeSingle();

      if (!error && data) {
        updateDeviceUI(data);
      } else {
        updateDeviceUI(null);
      }
    }

    function subscribeDeviceHealth() {
      supabaseClient
        .channel("device-health-realtime")
        .on("postgres_changes", { event: "*", schema: "public", table: "device_health" }, payload => {
          if (payload.new && payload.new.device_id === "MUSTER_UNIT_01") {
            updateDeviceUI(payload.new);
          }
        })
        .subscribe();
    }

    // ==========================================
    // 3. PERSONNEL PRESENCE LOGIC
    // ==========================================
    async function loadPresenceData() {
      const { data, error } = await supabaseClient
        .from("presence_state")
        .select("*")
        .order("user_name", { ascending: true });

      if (error) {
        console.error("Error loading presence records:", error);
        return;
      }

      personnelData = data || [];
      renderDashboard();
    }

    function subscribePresence() {
      supabaseClient
        .channel("presence-state-realtime")
        .on("postgres_changes", { event: "*", schema: "public", table: "presence_state" }, payload => {
          if (payload.eventType === "INSERT") {
            personnelData.push(payload.new);
          } else if (payload.eventType === "UPDATE") {
            const index = personnelData.findIndex(u => u.user_id === payload.new.user_id);
            if (index !== -1) personnelData[index] = payload.new;
            else personnelData.push(payload.new);
          } else if (payload.eventType === "DELETE") {
            personnelData = personnelData.filter(u => u.user_id !== payload.old.user_id);
          }
          renderDashboard();
        })
        .subscribe();
    }

    // Manual status override directly from the dashboard
    async function setManualStatus(userId, targetStatus) {
      await supabaseClient
        .from("presence_state")
        .update({
          status: targetStatus,
          last_zone: "Web Manual Override",
          last_updated: new Date().toISOString()
        })
        .eq("user_id", userId);
    }

    // ==========================================
    // 4. UI RENDERING & FILTERING
    // ==========================================
    function renderDashboard() {
      // 1. Update Metrics Summary
      let total = personnelData.length;
      let onsite = 0;
      let mustered = 0;
      let offsite = 0;

      personnelData.forEach(p => {
        const s = (p.status || "OFFSITE").toUpperCase();
        if (s === "ONSITE") onsite++;
        else if (s === "MUSTERED") mustered++;
        else offsite++;
      });

      document.getElementById("count-total").textContent = total;
      document.getElementById("count-onsite").textContent = onsite;
      document.getElementById("count-mustered").textContent = mustered;
      document.getElementById("count-offsite").textContent = offsite;

      // 2. Filter Rows
      const filtered = personnelData.filter(user => {
        const matchesFilter = currentFilter === "ALL" || (user.status || "OFFSITE").toUpperCase() === currentFilter;
        
        const q = searchTerm.toLowerCase();
        const matchesSearch = !q || 
          (user.user_name && user.user_name.toLowerCase().includes(q)) ||
          (user.company_name && user.company_name.toLowerCase().includes(q)) ||
          (user.card_number && user.card_number.toLowerCase().includes(q)) ||
          (user.last_zone && user.last_zone.toLowerCase().includes(q));

        return matchesFilter && matchesSearch;
      });

      // 3. Render Table
      const tbody = document.getElementById("presenceTableBody");
      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">No personnel matching current filters.</td></tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(user => {
        const status = (user.status || "OFFSITE").toUpperCase();
        const updatedTime = user.last_updated ? new Date(user.last_updated).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '-';
        
        return `
          <tr>
            <td>
              <div class="user-info-name">${escapeHtml(user.user_name || "Unknown")}</div>
              <div class="user-info-sub">ID: ${escapeHtml(user.user_id || "-")}</div>
            </td>
            <td>
              <div>${escapeHtml(user.company_name || "-")}</div>
              <div class="user-info-sub">${escapeHtml(user.telephone_number || "-")}</div>
            </td>
            <td>
              <code>${escapeHtml(user.card_number || "—")}</code>
            </td>
            <td>
              <div>${escapeHtml(user.last_zone || "-")}</div>
              <div class="user-info-sub">${escapeHtml(user.zone_name || "")}</div>
            </td>
            <td>
              <span class="status-badge status-${status}">
                ● ${status}
              </span>
            </td>
            <td style="color: var(--text-muted); font-size: 0.85rem;">
              ${updatedTime}
            </td>
            <td>
              ${status === 'ONSITE' 
                ? `<button class="btn-action" onclick="setManualStatus('${user.user_id}', 'MUSTERED')">Mark Mustered</button>`
                : `<button class="btn-action" onclick="setManualStatus('${user.user_id}', 'ONSITE')">Set On-Site</button>`
              }
            </td>
          </tr>
        `;
      }).join("");
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    // ==========================================
    // 5. EVENT LISTENERS & INITIALIZATION
    // ==========================================
    document.querySelectorAll(".btn-filter").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".btn-filter").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        renderDashboard();
      });
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchTerm = e.target.value;
      renderDashboard();
    });

    // Run initialization
    loadPresenceData();
    loadDeviceHealth();
    subscribePresence();
    subscribeDeviceHealth();

    // Periodic evaluation of device offline state (every 60s)
    setInterval(loadDeviceHealth, 60 * 1000);
  </script>
</body>
</html>
